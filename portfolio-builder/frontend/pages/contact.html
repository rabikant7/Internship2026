<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — PortfolioBuilder</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div id="navbar"></div>

  <main class="container">
    <section class="page-hero fade-in">
      <h1>Get In Touch</h1>
      <p>Questions, feedback, or found a bug? We'd love to hear from you.</p>
    </section>

    <div class="contact-layout">
      <div class="card contact-info-card">
        <h3 style="margin-bottom:14px;">Contact Info</h3>
        <p>✉️ support@portfoliobuilder.example</p>
        <p>💬 We usually reply within 1-2 business days.</p>
        <p>📚 This is a student learning project — feedback helps us improve it!</p>
      </div>

      <div class="card">
        <form id="contactForm" novalidate>
          <div class="form-group">
            <label for="contactName">Name</label>
            <input type="text" id="contactName" placeholder="Your name" />
            <div class="field-error" id="contactNameError"></div>
          </div>
          <div class="form-group">
            <label for="contactEmail">Email</label>
            <input type="email" id="contactEmail" placeholder="you@example.com" />
            <div class="field-error" id="contactEmailError"></div>
          </div>
          <div class="form-group">
            <label for="contactMessage">Message</label>
            <textarea id="contactMessage" rows="5" placeholder="How can we help?"></textarea>
            <div class="field-error" id="contactMessageError"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../js/main.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../js/contact.js"></script>
</body>
</html>
