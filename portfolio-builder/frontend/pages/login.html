<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — PortfolioBuilder</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div id="navbar"></div>

  <main class="auth-wrapper">
    <div class="auth-card fade-in">
      <h2>Welcome back</h2>
      <p class="auth-sub">Log in to continue building your portfolio</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" />
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" />
          <div class="field-error" id="passwordError"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
      </form>

      <p class="auth-footer-text">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../js/main.js"></script>
  <script src="../js/api.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
