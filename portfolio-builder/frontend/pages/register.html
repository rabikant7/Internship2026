<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — PortfolioBuilder</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div id="navbar"></div>

  <main class="auth-wrapper">
    <div class="auth-card fade-in">
      <h2>Create your account</h2>
      <p class="auth-sub">Start building your portfolio in minutes</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Jane Doe" />
          <div class="field-error" id="nameError"></div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" />
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" />
          <div class="field-error" id="passwordError"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" />
          <div class="field-error" id="confirmPasswordError"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create Account</button>
      </form>

      <p class="auth-footer-text">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../js/main.js"></script>
  <script src="../js/api.js"></script>
  <script src="../components/navbar.js"></script>
  <script src="../components/footer.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
